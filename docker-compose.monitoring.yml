# Stack de supervision, deployee a cote des stacks applicatives sur le VPS.
# Un seul exemplaire supervise staging + prod : metriques (Prometheus),
# logs (Loki/Promtail), dashboards + alertes Discord (Grafana).
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - default
      - app-staging
      - app-prod

  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.nookapp.eu}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      DISCORD_ALERT_WEBHOOK: ${DISCORD_ALERT_WEBHOOK}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Acces local (dev) ; en prod c'est Traefik qui route via le domaine.
    ports:
      - '127.0.0.1:${GRAFANA_LOCAL_PORT:-3001}:3000'
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.nookapp-grafana.rule=Host(`${GRAFANA_DOMAIN:-grafana.nookapp.eu}`)
      - traefik.http.routers.nookapp-grafana.entrypoints=websecure
      - traefik.http.routers.nookapp-grafana.tls.certresolver=letsencrypt
      - traefik.http.services.nookapp-grafana.loadbalancer.server.port=3000

  loki:
    image: grafana/loki:3.4.1
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - default

  promtail:
    image: grafana/promtail:3.4.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/positions
    networks:
      - default

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - default

  postgres-exporter-staging:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${MONITORING_DATABASE_URL_STAGING}
    networks:
      - default
      - app-staging

  postgres-exporter-prod:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${MONITORING_DATABASE_URL_PROD}
    networks:
      - default
      - app-prod

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - default

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:

networks:
  default:
  app-staging:
    external: true
    name: ${STAGING_NETWORK:-nookapp-staging_default}
  app-prod:
    external: true
    name: ${PROD_NETWORK:-nookapp-prod_default}
  proxy:
    external: true
    name: dokploy-network
